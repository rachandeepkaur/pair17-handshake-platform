# Non-secret settings shared by all six backend services (envFrom).
# Passwords and the JWT secret come from the p17-handshake-secrets Secret,
# which k8s/deploy.sh creates from the git-ignored k8s/secrets.env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: p17-backend-config
data:
  PAIR: "17"
  PORT_BASE: "9170"
  DB_PREFIX: p17
  SEED: "17"
  CITY_SET: Palo Alto,Mountain View,Menlo Park
  # Kubernetes service discovery: short Service names resolve inside the p17-handshake namespace.
  # MongoDB is the system of record (MySQL was migrated away in Lab 2).
  MONGO_HOST: p17-mongodb:27017
  MONGO_USER: p17_admin
  MONGO_DB: p17_handshake
  KAFKA_BOOTSTRAP_SERVERS: p17-kafka:9092
  JWT_ALGORITHM: HS256
  JWT_EXPIRE_MINUTES: "60"
  CORS_ORIGINS: http://localhost:9170,http://localhost:5173
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: p17-assistant-config
data:
  # Ollama on the developer machine (Docker Desktop resolves host.docker.internal from pods).
  # Point this at an in-cluster Ollama Service when one is deployed.
  OLLAMA_HOST: http://host.docker.internal:11434
  OLLAMA_MODEL: qwen3:8b
  # Platform services the assistant checks in GET /health, reached by Service name.
  PLATFORM_SERVICE_URLS: >-
    student=http://p17-student-service:9171,job=http://p17-job-service:9173,event=http://p17-event-service:9175,application=http://p17-application-service:9174,company=http://p17-company-service:9172
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: p17-frontend-config
data:
  # nginx's runtime resolver ignores DNS search domains, so the gateway needs FQDNs.
  P17_SERVICE_SUFFIX: .p17-handshake.svc.cluster.local
