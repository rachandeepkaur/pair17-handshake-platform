# MySQL 8: the Lab 1 system of record. Single replica with a persistent volume.
# The schema ConfigMap (p17-mysql-init) is created by k8s/deploy.sh from backend/db/schema.sql
# and runs only when the volume is empty.
apiVersion: v1
kind: Service
metadata:
  name: p17-mysql
  labels: {app.kubernetes.io/name: p17-mysql}
spec:
  clusterIP: None  # headless: DNS resolves straight to the StatefulSet pod
  selector: {app.kubernetes.io/name: p17-mysql}
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p17-mysql
  labels: {app.kubernetes.io/name: p17-mysql}
spec:
  serviceName: p17-mysql
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: p17-mysql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: p17-mysql}
    spec:
      enableServiceLinks: false
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - {name: mysql, containerPort: 3306}
          env:
            - name: MYSQL_DATABASE
              value: p17_handshake
            - name: MYSQL_USER
              value: p17_app
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: p17-handshake-secrets, key: MYSQL_ROOT_PASSWORD}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: p17-handshake-secrets, key: DB_PASSWORD}}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql  # keep the datadir free of lost+found on ext4 volumes
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            # TCP on 127.0.0.1 stays closed while init scripts run.
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: initdb
          configMap:
            name: p17-mysql-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
