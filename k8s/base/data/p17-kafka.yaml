# Kafka 3.8, single-node KRaft (broker + controller, no ZooKeeper).
apiVersion: v1
kind: Service
metadata:
  name: p17-kafka
  labels: {app.kubernetes.io/name: p17-kafka}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: p17-kafka}
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p17-kafka
  labels: {app.kubernetes.io/name: p17-kafka}
spec:
  serviceName: p17-kafka
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: p17-kafka}
  template:
    metadata:
      labels: {app.kubernetes.io/name: p17-kafka}
    spec:
      # Service links would inject variables such as P17_KAFKA_PORT; the image reads KAFKA_* as config.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000  # the image runs as appuser (uid 1000)
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - {name: kafka, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          env:
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            # Clients in the namespace reach the broker by its Service name.
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://p17-kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            # A subdirectory, so a lost+found at the volume root is not read as a partition.
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx512m"}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1536Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
