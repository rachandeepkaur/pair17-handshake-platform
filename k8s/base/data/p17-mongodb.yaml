# MongoDB 7. Single replica with a persistent volume.
apiVersion: v1
kind: Service
metadata:
  name: p17-mongodb
  labels: {app.kubernetes.io/name: p17-mongodb}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: p17-mongodb}
  ports:
    - name: mongodb
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p17-mongodb
  labels: {app.kubernetes.io/name: p17-mongodb}
spec:
  serviceName: p17-mongodb
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: p17-mongodb}
  template:
    metadata:
      labels: {app.kubernetes.io/name: p17-mongodb}
    spec:
      enableServiceLinks: false
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - {name: mongodb, containerPort: 27017}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: p17_admin
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: p17-handshake-secrets, key: MONGO_PASSWORD}}
            - name: MONGO_INITDB_DATABASE
              value: p17_handshake
          volumeMounts:
            - name: data
              mountPath: /data/db
              subPath: mongodb
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: 27017}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
