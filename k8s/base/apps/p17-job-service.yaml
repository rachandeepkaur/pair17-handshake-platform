# p17-job-service: company job postings and student job search.
# Reached by other pods at http://p17-job-service:9173 (Kubernetes service discovery).
apiVersion: v1
kind: Service
metadata:
  name: p17-job-service
  labels: {app.kubernetes.io/name: p17-job-service, app.kubernetes.io/component: backend}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: p17-job-service}
  ports:
    - name: http
      port: 9173
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p17-job-service
  labels: {app.kubernetes.io/name: p17-job-service, app.kubernetes.io/component: backend}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: p17-job-service}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: p17-job-service, app.kubernetes.io/component: backend}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10017  # the image's p17 user
        runAsGroup: 10017
        fsGroup: 10017
      containers:
        - name: job
          image: p17-job-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 9173}
          envFrom:
            - configMapRef: {name: p17-backend-config}
          env:
            - {name: SERVICE_NAME, value: job}
            - {name: PORT, value: "9173"}
            - name: MONGO_PASSWORD
              valueFrom: {secretKeyRef: {name: p17-handshake-secrets, key: MONGO_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: p17-handshake-secrets, key: JWT_SECRET}}
            # Assembled in the pod from the ConfigMap and Secret; no password in the manifest.
            - name: MONGO_URI
              value: mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@$(MONGO_HOST)/?authSource=admin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          # Ready only when MongoDB and Kafka are reachable (503 otherwise).
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Restart only if the process itself stops answering, not when a dependency is down.
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "500m", memory: 512Mi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: p17-job-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: p17-job-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
