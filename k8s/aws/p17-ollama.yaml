# In-cluster Ollama for EKS. Locally the assistant uses Ollama on the host
# (host.docker.internal); on AWS there is no host, so the model runs as a pod.
# k8s/aws/make-overlay.sh copies this file into k8s/overlays/aws and points
# OLLAMA_HOST at the p17-ollama Service.
#
# The model is pulled once on first start and kept on the p17-ollama-models volume,
# so pod restarts and node scale-down/up don't download it again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p17-ollama-models
  namespace: p17-handshake
  labels: {app.kubernetes.io/name: p17-ollama, app.kubernetes.io/part-of: p17-handshake}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p17-ollama
  namespace: p17-handshake
  labels: {app.kubernetes.io/name: p17-ollama, app.kubernetes.io/part-of: p17-handshake}
spec:
  replicas: 1
  strategy: {type: Recreate}           # the model volume attaches to one node at a time
  selector:
    matchLabels: {app.kubernetes.io/name: p17-ollama}
  template:
    metadata:
      labels: {app.kubernetes.io/name: p17-ollama, app.kubernetes.io/part-of: p17-handshake}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.40.16
          command: ["/bin/sh", "-c"]
          # Serve, pull the model if it isn't on the volume yet, then stay in the foreground.
          args:
            - |
              ollama serve &
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull "$OLLAMA_MODEL"
              wait
          env:
            - name: OLLAMA_MODEL
              valueFrom: {configMapKeyRef: {name: p17-assistant-config, key: OLLAMA_MODEL}}
            - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
            - {name: OLLAMA_KEEP_ALIVE, value: "-1"}     # keep the model loaded between requests
            - {name: OLLAMA_NUM_PARALLEL, value: "1"}
            - {name: OLLAMA_MAX_LOADED_MODELS, value: "1"}  # one model in memory at a time
          ports:
            - {name: http, containerPort: 11434}
          # Ready only once the model is on disk, so the assistant never hits a missing model.
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "ollama list | grep -q \"$OLLAMA_MODEL\""]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            # No CPU limit: inference uses whatever CPU the idle services leave free.
            requests: {cpu: 500m, memory: 4Gi}
            limits: {memory: 6Gi}
          volumeMounts:
            - {name: models, mountPath: /root/.ollama}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: p17-ollama-models}
---
apiVersion: v1
kind: Service
metadata:
  name: p17-ollama
  namespace: p17-handshake
  labels: {app.kubernetes.io/name: p17-ollama, app.kubernetes.io/part-of: p17-handshake}
spec:
  selector: {app.kubernetes.io/name: p17-ollama}
  ports:
    - {name: http, port: 11434, targetPort: http}
