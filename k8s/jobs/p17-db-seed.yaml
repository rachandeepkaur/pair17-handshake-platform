# One-shot job that loads the deterministic Pair 17 demo data into MongoDB.
#   kubectl apply -f k8s/jobs/p17-db-seed.yaml
#   kubectl -n p17-handshake logs -f job/p17-db-seed
# It refuses to run against a database that already has data.
apiVersion: batch/v1
kind: Job
metadata:
  name: p17-db-seed
  namespace: p17-handshake
  labels: {app.kubernetes.io/name: p17-db-seed, app.kubernetes.io/part-of: p17-handshake}
spec:
  backoffLimit: 4  # retries while MongoDB is still starting
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: p17-db-seed}
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: seed
          image: p17-db-seed:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: p17-backend-config}
          env:
            - name: MONGO_PASSWORD
              valueFrom: {secretKeyRef: {name: p17-handshake-secrets, key: MONGO_PASSWORD}}
            - name: MONGO_URI
              value: mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@$(MONGO_HOST)/?authSource=admin
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
