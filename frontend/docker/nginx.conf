# Pair 17 web gateway: serves the React build and routes /api/* to the six
# backend services on the p17-handshake-net network (prefix stripped).

# Most specific patterns first: nginx uses the first matching regex.
map $uri $p17_backend {
    default                                               "";
    ~^/api/auth/signup/student$                           p17-student-service:9171;
    ~^/api/student/jobs/[0-9]+/apply$                     p17-application-service:9174;
    ~^/api/student/applications(/|$)                      p17-application-service:9174;
    ~^/api/student/preferences(/|$)                       p17-student-service:9171;
    ~^/api/student/jobs(/|$)                              p17-job-service:9173;
    ~^/api/student/events(/|$)                            p17-event-service:9175;
    ~^/api/students(/|$)                                  p17-student-service:9171;
    ~^/api/uploads/profile_pictures/                      p17-student-service:9171;
    ~^/api/(auth|companies|team|messages|dashboards)(/|$) p17-company-service:9172;
    ~^/api/jobs(/|$)                                      p17-job-service:9173;
    ~^/api/applications(/|$)                              p17-application-service:9174;
    ~^/api/events(/|$)                                    p17-event-service:9175;
    ~^/api/assistant(/|$)                                 p17-assistant-service:9176;
}

map $uri $p17_health_backend {
    default                   "";
    ~^/api/health/student$     p17-student-service:9171;
    ~^/api/health/company$     p17-company-service:9172;
    ~^/api/health/job$         p17-job-service:9173;
    ~^/api/health/application$ p17-application-service:9174;
    ~^/api/health/event$       p17-event-service:9175;
    ~^/api/health/assistant$   p17-assistant-service:9176;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS; resolving per request lets nginx start before the services.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    client_max_body_size 6m;  # resumes are capped at 5 MB by the API

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    # GET /api/health/<service> -> that service's GET /health
    location ^~ /api/health/ {
        if ($p17_health_backend = "") { return 404; }
        rewrite ^ /health break;
        proxy_pass http://$p17_health_backend;
    }

    location ^~ /api/ {
        # Only applies to the 404 below; proxied responses keep their own Content-Type.
        default_type application/json;
        if ($p17_backend = "") {
            return 404 '{"detail":"No service handles this path."}';
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$p17_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A CPU-only 8B model can take minutes per assistant turn.
        proxy_read_timeout 400s;
        proxy_send_timeout 400s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
